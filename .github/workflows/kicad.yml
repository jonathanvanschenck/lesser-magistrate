# Design checks on the KiCad boards (ERC, DRC + schematic/board parity, trigger crosstalk simulation, BOM tables in
# components/README.md), plus fabrication outputs as a build artifact.
# Runs the same script developers run locally: tools/kicad/check.sh
name: KiCad checks

on:
  push:
    paths: ['kicad/**', 'sim/**', 'components/**', 'tools/kicad/**', 'tools/bom/**', '.github/workflows/kicad.yml']
  pull_request:
    paths: ['kicad/**', 'sim/**', 'components/**', 'tools/kicad/**', 'tools/bom/**', '.github/workflows/kicad.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      options: --user root   # actions/checkout needs to write to the workspace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4   # for tools/bom/bom.mjs
        with:
          node-version: 22

      - name: ERC, DRC, crosstalk simulation and BOM tables
        run: tools/kicad/check.sh --fab

      - name: Upload reports and fabrication outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-outputs
          path: |
            build/kicad/
            build/sim/
